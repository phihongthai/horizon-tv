plugins {
    id 'com.android.application'
}

android {
    namespace 'app.horizontv.home'
    compileSdk 34

    defaultConfig {
        applicationId 'app.horizontv.home'
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName '1.0.0'
    }

    signingConfigs {
        release {
            storeFile file(System.getenv('HORIZON_KEYSTORE') ?: 'release.jks')
            storePassword System.getenv('HORIZON_STORE_PASS')
            keyAlias 'horizon'
            keyPassword System.getenv('HORIZON_STORE_PASS')
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
